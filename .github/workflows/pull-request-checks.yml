name: Pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-frontend:
    name: API tests and frontend syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run backend and build-script tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m py_compile build_api/main.py scripts/build_apk.py tests/test_api.py tests/test_build_script.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check builder JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('apk-builder.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/apk-builder-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/apk-builder-inline.js

  android-template:
    name: Compile default Android template
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile template APK
        run: gradle assembleDebug --no-daemon --max-workers=2
