name: APK build worker
run-name: APK build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Render API job identifier
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: apk-builder-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out template
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test API request and lock behavior
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36.1 platform and build tools
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project and build debug APK
        env:
          JOB_ID: ${{ inputs.job_id }}
          BUILD_API_URL: ${{ secrets.BUILD_API_URL }}
          INTERNAL_WORKER_TOKEN: ${{ secrets.INTERNAL_WORKER_TOKEN }}
        run: python scripts/build_apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
