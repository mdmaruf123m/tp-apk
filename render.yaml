services:
  - type: web
    name: tp-apk-builder-api
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn build_api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: BUILD_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: mdmaruf123m/tp-apk
      - key: GITHUB_WORKFLOW_FILE
        value: apk-build.yml
      - key: INTERNAL_WORKER_TOKEN
        sync: false
      - key: DOWNLOAD_SIGNING_KEY
        sync: false
  - type: web
    name: tp-apk-notification-api
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: off
    buildCommand: pip install -r notification_api/requirements.txt
    startCommand: uvicorn notification_api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: NOTIFICATION_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
